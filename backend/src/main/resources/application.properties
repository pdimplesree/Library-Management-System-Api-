# ==========================================================
# Aditya University Smart Library - Spring Boot Configuration
# ==========================================================

spring.application.name=aditya-smart-library-backend
server.port=8080

# Profile selection (default uses persistent file-backed DB with MySQL mode; activate 'mysql' profile for full MySQL server)
# spring.profiles.active=mysql

# Persistent Database Configuration (MySQL Mode with disk persistence across restarts)
spring.datasource.url=jdbc:h2:file:./library_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Secret & Expiration
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Library Capacity Settings
library.capacity.total-students=150
library.capacity.total-seats=50
library.reservations.expiry-minutes=60
library.reservations.expiry-check-rate-ms=30000

# In-App Notifications Scheduled Check Rate (every 60 seconds)
library.schedule.reminder-rate-ms=60000
